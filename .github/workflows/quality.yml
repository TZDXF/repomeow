name: Quality

on:
  pull_request:
    branches:
      - main
      - dev
  push:
    branches:
      - main
      - dev

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 11.10.0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Run unit tests
        run: pnpm test:unit

      - name: Build
        run: pnpm build

  rust:
    name: Rust tests
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 11.10.0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      # 该 action 以 `--profile minimal` 安装工具链,clippy 必须显式声明,
      # 否则下方 clippy 门禁会以 “no such command: clippy” 失败。
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Prepare sem sidecar
        run: pnpm sem:prepare --target x86_64-pc-windows-msvc

      # 门禁:clippy 严格模式(--all-targets 覆盖单测/集成测试,-D warnings 把
      # 所有 lint 与默认拒绝的 rustc 警告都当错误)。放在测试之前,好让风格问题
      # 最快失败;复用上方 rust-cache,增量检查不会重复全量编译。
      - name: Lint (clippy)
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test --locked

      - name: Build frontend for release CLI embedding
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Build console and desktop release executables
        run: cargo build --release --locked --bins --manifest-path src-tauri/Cargo.toml

      - name: Test console streams, exits, isolation and concurrent writes
        run: pnpm test:cli --exe src-tauri/target/release/repomeow-cli.exe

      - name: Test Actions PowerShell success and failure propagation
        run: pnpm test:cli:shells --exe src-tauri/target/release/repomeow-cli.exe

      - name: Test Windows PowerShell direct calls
        shell: powershell
        run: ./scripts/test-cli.ps1 -Exe src-tauri/target/release/repomeow-cli.exe

      - name: Test PowerShell 7 direct calls
        shell: pwsh
        run: ./scripts/test-cli.ps1 -Exe src-tauri/target/release/repomeow-cli.exe
