name: Quality

on:
  pull_request:
    branches:
      - main
      - dev
  push:
    branches:
      - main
      - dev

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 11.10.0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Run unit tests
        run: pnpm test:unit

      - name: Build
        run: pnpm build

  rust:
    name: Rust tests
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 11.10.0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      # 该 action 以 `--profile minimal` 安装工具链,clippy 必须显式声明,
      # 否则下方 clippy 门禁会以 “no such command: clippy” 失败。
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # 门禁:clippy 严格模式(--all-targets 覆盖单测/集成测试,-D warnings 把
      # 所有 lint 与默认拒绝的 rustc 警告都当错误)。放在测试之前,好让风格问题
      # 最快失败;复用上方 rust-cache,增量检查不会重复全量编译。
      - name: Lint (clippy)
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test --locked

      - name: Build frontend for release CLI embedding
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Build console and desktop release executables
        run: cargo build --release --locked --bins --manifest-path src-tauri/Cargo.toml

      - name: Test console streams, exits, isolation and concurrent writes
        run: pnpm test:cli --exe src-tauri/target/release/repomeow-cli.exe

      - name: Test Actions PowerShell success and failure propagation
        run: pnpm test:cli:shells --exe src-tauri/target/release/repomeow-cli.exe

      - name: Test Windows PowerShell direct calls
        shell: powershell
        run: ./scripts/test-cli.ps1 -Exe src-tauri/target/release/repomeow-cli.exe

      - name: Test PowerShell 7 direct calls
        shell: pwsh
        run: ./scripts/test-cli.ps1 -Exe src-tauri/target/release/repomeow-cli.exe

  # 独立 macOS job:与上方 frontend(ubuntu)/rust(windows)并行,不改动它们的门禁与
  # release.yml。范围只取能在 macOS 上真实复现的部分——前端 lint/format/单测/构建
  # 与 Rust 单测。CLI 回归(scripts/test-cli*.mjs 与 test-cli.ps1)依赖 PowerShell
  # 与 .exe 产物,不在本 job 内。
  macos:
    name: macOS tests
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # 记录真实运行环境:真机(Mac mini)复跑时同样先跑这一段,便于对齐系统版本与架构。
      - name: Report macOS environment
        run: |
          sw_vers
          echo "arch: $(uname -m)"
          echo "xcode: $(xcode-select -p)"

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 11.10.0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Report toolchain versions
        run: |
          node --version
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Run unit tests
        run: pnpm test:unit

      - name: Build
        run: pnpm build

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: macos-${{ runner.arch }}

      # 门禁是 `cargo test --locked`,与 windows job 同一入口。下面 7 个用例在 macOS
      # 上必然失败,原因都是用例本身的 Windows 语义/环境假设(不是产品缺陷),逐个改成
      # 平台无关断言后应删除对应 --skip。Java 两项曾在此列表,已随产品缺陷修复而回归
      # (见 builds.rs 的 wrapper_or_system:只有真的用 wrapper 才加 ./ 前缀)。
      # 串行执行:data_sync / wiki 的文件锁断言用纳秒时间戳建临时目录,并行时同名目录
      # 会互相抢锁造成偶发失败;单线程 19.5s(并行 3.5s),在 30 分钟预算内可接受。
      #   restricted_env::unix_paths_stay_case_sensitive —— APFS 默认大小写不敏感
      #   editor_icon::exe_refs_* (3) —— 用例输入是 Windows 路径,Unix join 行为不同
      #   toolchain::go_detection_and_operations —— caps 依据 source==brew,mac 无 winget
      #   terminal_ipc::project_resolution_uses_registered_active_project —— 写死 D:\\ 路径
      #   ai::resource_library::sync_pull_push_status_and_remote_gone —— 依赖 init.defaultBranch
      - name: Run Rust tests
        working-directory: src-tauri
        run: |
          cargo test --locked -- --test-threads=1 \
            --skip agent::harness::restricted_env::tests::unix_paths_stay_case_sensitive \
            --skip commands::editor_icon::tests::exe_refs_expands_env_vars \
            --skip commands::editor_icon::tests::exe_refs_jetbrains_toolbox_style \
            --skip commands::editor_icon::tests::exe_refs_vscode_style_shim \
            --skip commands::toolchain::tests::go_detection_and_operations \
            --skip terminal_ipc::tests::project_resolution_uses_registered_active_project \
            --skip commands::ai::resource_library::tests::sync_pull_push_status_and_remote_gone
