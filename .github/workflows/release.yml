name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    # 跨平台矩阵:四个构建目标并行,产物全部上传到同一个 draft Release,
    # tauri-action 汇总各平台签名文件生成 latest.json(updater 端点)。
    #
    # macOS 签名现状(方案 A,过渡止血):用 ad-hoc 身份 `-` 让 bundler 自己做完
    # 由内到外的 codesign(见下方 APPLE_SIGNING_IDENTITY 注释),并在构建后跑
    # scripts/ci/verify-macos-sign.sh 校验三个分发载体的签名,且断言三者 CDHash
    # 相等(即同一份签名,不只是各自签名有效)。
    # ad-hoc **不等于** Gatekeeper 放行:用户首次打开仍会看到「Apple 无法验证…」。
    # 实测放行是四步、且需要管理员账户:
    #   ① 双击 →「未打开 …Apple 无法验证…」
    #   ②「系统设置 → 隐私与安全性」点「仍要打开」
    #   ③ 再弹一次「打开 X?」确认
    #   ④ 输入管理员名称与密码(SecurityAgent 授权框)——非管理员账户过不去
    # 「右键 → 打开」这条路径**未验证**(Finder /Applications 的 AX 树里取不到
    # 应用项),不要据此承诺给用户。
    # 拿到 Developer ID 证书 + 公证凭据(方案 C)后,门禁追加 spctl/stapler 断言即
    # 可做到双击无提示;在那之前不要断言 `spctl ... accepted`(见脚本头部注释)。
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows:NSIS 安装包(tauri.conf.json bundle.targets 默认 nsis)
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: "--bundles nsis"
          # macOS:sem sidecar 无 universal 二进制,arm64 / x64 各构建一次;
          # Apple 工具链可在 arm64 机器上原生编译 x86_64 目标,无需独立 Intel runner。
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin --bundles dmg app"
          - platform: macos-latest
            target: x86_64-apple-darwin
            args: "--target x86_64-apple-darwin --bundles dmg app"
          # Linux:选 22.04 而非 24.04——WebKitGTK 4.1 依赖齐全,AppImage 工具链(libfuse2)开箱可用
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: "--bundles deb appimage"
    runs-on: ${{ matrix.platform }}
    # 显式声明环境,让 ${{ secrets.* }} 能拿到 update 这个 Environment 下的私钥;
    # 仓库级 Repository secrets 当前为空,如果不声明 environment,CI 读不到密钥。
    environment: update
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 11.10.0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      # Tauri 2.11.4 signer bug: when the password env is **undefined**, the
      # signer silently fails ("Signing without password." then exits 0 with no
      # .sig written). Setting it to an empty string forces the no-password
      # branch to actually run.
      - name: Pin empty updater signing password
        env:
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD is set"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          # 两个 darwin job 同为 release job id,按 target 区分缓存键
          key: ${{ matrix.target }}

      # Tauri v2 Linux 构建前置依赖(官方 prerequisites 清单):WebKitGTK 4.1、
      # 托盘(libayatana-appindicator)、SVG 渲染(librsvg)、AppImage 重打包(patchelf)
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # sem:prepare 平台无关:按 --target 下载对应资产并校验 SHA-256
      # (scripts/sem/manifest.json 固定 5 个 triple 的版本与哈希)
      - name: Prepare sem sidecar
        run: pnpm sem:prepare --target ${{ matrix.target }}

      # 前置阅读:签名必须在 tauri-action **之内**完成,不能在它之后补签。
      # bundler 的打包顺序是 app(含由内到外的 codesign)→ dmg(装入已签 app)
      # → updater 载荷 .app.tar.gz(打包已签 app)→ minisign .sig;tauri-action 随后
      # 才把这三个载体上传进 draft Release。所以只要在**构建前**给出签名身份,三个载体
      # 天然是同一份签名;反过来先上传再补签,就要重打包 dmg、重打 tar.gz、重签 .sig
      # 再覆盖远端资产,而且很容易让 dmg 里的 app 与 updater 载荷的签名不一致——
      # 那正是把「用户升级路径又坏一次」的写法。
      #
      # APPLE_SIGNING_IDENTITY 由 tauri-cli 覆盖到 bundle.macOS.signingIdentity
      # (crates/tauri-cli/src/interface/rust.rs)。`-` 是 codesign 的 ad-hoc 身份:
      # bundler 走正常签名分支,逐一把 sidecar(sem / repomeow-cli)与 app bundle
      # 用 `codesign --force -s - --options runtime` 签一遍并生成 _CodeSignature,
      # 资源密封(Sealed Resources)随之成立——「已损坏」的直接对因就此消失。
      # dmg 容器本身在 identity 为 `-` 时按 bundler 逻辑跳过自签名(tauri#12288),
      # 这不影响用户打开:Gatekeeper 评估的是从 dmg 拖出来的那个 app。
      # 该变量在 Windows/Linux 上只会写进未被使用的 macOS bundle 设置,无副作用,
      # 因此不分平台写死,避免 `${{ ... && '-' || '' }}` 渲染出空串身份导致签名必失败。
      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 更新包签名私钥(空口令,密钥生成时未设密码)
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # 方案 A:ad-hoc 身份,零凭据。有 Developer ID 证书后换成证书身份(方案 C)
          APPLE_SIGNING_IDENTITY: "-"
        with:
          tagName: v__VERSION__
          releaseName: "v__VERSION__"
          # 编辑 draft 正文后必须运行 scripts/release/sync-notes.mjs 同步 latest.json.notes。
          releaseBody: "See the assets to download and install this version."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      # 签名门禁:对三个会分发出去的载体(源 .app / updater .app.tar.gz / dmg 内
      # 的 .app)逐一 `codesign --verify --strict`,再断言三者 CDHash 相等——
      # 逐份 --verify 只证明各自签名自洽,dmg 里换成另一份单独重签过的 app 也能全绿;
      # CDHash 一致才证明三载体是同一份签名(用户升级路径不会装到另一个 app)。
      # 任一不符即 job 红。
      # 这里**故意不**断言 `spctl ... accepted`:ad-hoc 阶段 Gatekeeper 必然 rejected
      # (本机实测 exit 3),断言它就是永远红。拿到证书与公证凭据后,在本步骤追加
      #   spctl -a -vvv -t exec <app>   期望 accepted 且 source=Notarized Developer ID
      #   xcrun stapler validate <app>  期望票据校验通过
      - name: Verify macOS signature
        if: matrix.platform == 'macos-latest'
        run: ./scripts/ci/verify-macos-sign.sh ${{ matrix.target }}
