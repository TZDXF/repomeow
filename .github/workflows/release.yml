name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release-windows:
    runs-on: windows-latest
    # 显式声明环境,让 ${{ secrets.* }} 能拿到 update 这个 Environment 下的私钥;
    # 仓库级 Repository secrets 当前为空,如果不声明 environment,CI 读不到密钥。
    environment: update
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 11.10.0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      # Tauri 2.11.4 signer bug: when the password env is **undefined**, the
      # signer silently fails ("Signing without password." then exits 0 with no
      # .sig written). Setting it to an empty string forces the no-password
      # branch to actually run.
      - name: Pin empty updater signing password
        env:
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD is set"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 更新包签名私钥(空口令,密钥生成时未设密码)
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: v__VERSION__
          releaseName: "v__VERSION__"
          releaseBody: "See the assets to download and install this version."
          releaseDraft: true
          prerelease: false
