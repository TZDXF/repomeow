[package]
name = "repomeow"
version = "0.2.22"
description = "A Tauri App"
authors = ["you"]
edition = "2021"
# tauri 2.12.7 的 rust-version 为 1.90(2.11.x 是 1.77.2);显式声明让工具链过低时
# 直接报 MSRV 错误,而不是在依赖里出现难以定位的编译失败。
rust-version = "1.90"
default-run = "repomeow"

[[bin]]
name = "repomeow-cli"
path = "src/bin/repomeow-cli.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "repomeow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# tauri 2.12 起依赖 tray-icon 0.25:macOS 27 上托盘左键不再被 NSStatusItem 上长期挂着的
# NSMenu 吞掉(tray-icon 0.24 的行为),这是「单击展示列表」在 macOS 生效的前提。
tauri = { version = "2.12", features = ["protocol-asset", "tray-icon", "image-png", "devtools"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-store = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml_ng = "0.10"
ignore = "0.4"
# walk 缓存的失效监听:项目内 package.json / yaml 变更时即时让目录遍历缓存失效
notify = "8"
rusqlite = { version = "0.40.2", features = ["bundled"] }
# codex/grokbuild 的 cc-switch settings_config 内嵌 TOML 文本
toml = "1.1.6"
# codex 项目 .codex/config.toml 的 MCP 服务器编辑:保格式(注释/排版不丢)
toml_edit = "0.25.15"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.13", features = ["json", "blocking"] }
# OpenAI 兼容请求统一经 SDK；byot 用于向兼容服务商附加思考模式等扩展字段。
async-openai = { version = "0.42", default-features = false, features = ["rustls", "chat-completion", "model", "byot"] }
thiserror = "2"
# CLI 子命令解析(derive)
clap = { version = "4", features = ["derive"] }
anyhow = "1"
# 编辑器图标提取(image 负责缩放与 PNG 编码;pelite/ico 解析 Windows exe 资源;
# plist/icns 解析 macOS .app 图标)——四个均为纯 Rust,放通用依赖以便跨平台编译与单测
image = { version = "0.25.10", default-features = false, features = ["png"] }
pelite = "0.10.0"
ico = "0.5.0"
icns = "0.4.0"
plist = "1.10.0"
# git 读操作(status/分支/log/diff 等)走 libgit2 避免子进程开销;
# 写操作与网络操作(fetch/pull/push/clone)仍走系统 git CLI。
# default-features = false:只读本地操作不需要 https/ssh,避免引入 OpenSSL/libssh2
git2 = { version = "0.21", default-features = false }
# 全文搜索(search_project_text)的单词边界与用户正则模式
globset = "0.4"
regex = "1"
scraper = "0.27"
# JDK 在线安装(install_jdk)解压发行包 zip;仅 deflate 即可覆盖 Adoptium/Zulu 的归档
zip = { version = "8.6", default-features = false, features = ["deflate"] }
# JDK 归档校验及有界 tar.gz 解压
sha2 = "0.10"
tar = "0.4"
# 提交内图片预览(git_commit_file_blob):git blob 内容 base64 编码后经 IPC 传前端拼 data: URL
base64 = "0.23"
# docker 导出可选 gzip 压缩:纯 Rust 编码器,避免依赖系统 gzip(Windows 无内置)
flate2 = "1"
# ACP(Agent Client Protocol)官方客户端:wiki agent 后端与本地 coding agent CLI 的 JSON-RPC over stdio 交互
# unstable_end_turn_token_usage:PromptResponse.usage(UNSTABLE,agent 未必上报)供用量统计
agent-client-protocol = { version = "2", features = ["unstable_end_turn_token_usage"] }
# ACP agent 未上报 usage 时,按发送的 prompt 与最终正文估算 token 数
tiktoken-rs = "0.12"
# agent 子进程 spawn(与 agent-client-protocol 内部实现同源;自带 unix 进程组/Windows 无窗口标志)
async-process = "2"
# stderr 尾部采集等 futures AsyncRead 用法
futures = "0.3"
# agent CLI 安装探测(Windows 正确处理 PATHEXT/.cmd)
which = "8"
# 内嵌终端输出解码:中文 Windows 下 cmd 内建命令/部分工具按 GBK 输出,UTF-8 校验失败时回退
encoding_rs = "0.8"
similar = "3"
jsonschema = "0.56.0"
# 库内 ID 的系统随机源
getrandom = "0.4"
portable-pty = "0.9.0"

[dev-dependencies]
urlpattern = "0.6"
url = "2"

# 托盘双击判定要读系统双击间隔(macOS 托盘后端不派发 DoubleClick 事件),
# NSEvent::doubleClickInterval 需要该 crate 的 NSEvent feature;
# tauri 自身已按 macos 目标引入同版本 objc2-app-kit,这里不额外增加编译产物。
[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSEvent"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
# CLI 模式附加父进程控制台(windows_subsystem="windows" 默认无控制台)
windows-sys = { version = "0.61", features = ["Win32_System_Console", "Win32_System_Environment", "Win32_UI_WindowsAndMessaging"] }

# 开发保留 panic 回溯的行号，减少符号生成与链接占用；增量编译等仍用 Cargo 默认值。
# 完整断点/变量调试使用 --profile dev-debug，取舍与测量见 scripts/README-dev-build.md。
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# 独立输出到 target/dev-debug；显式覆盖通配规则，恢复依赖的完整调试信息。
[profile.dev-debug]
inherits = "dev"
debug = true

[profile.dev-debug.package."*"]
debug = true
