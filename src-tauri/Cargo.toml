[package]
name = "repomeow"
version = "0.1.16"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "repomeow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-store = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml_ng = "0.10"
ignore = "0.4"
# walk 缓存的失效监听:项目内 package.json / yaml 变更时即时让目录遍历缓存失效
notify = "8"
rusqlite = { version = "0.31", features = ["bundled"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.13", features = ["json", "blocking"] }
# OpenAI 兼容请求统一经 SDK；byot 用于向兼容服务商附加思考模式等扩展字段。
async-openai = { version = "0.41", default-features = false, features = ["rustls", "chat-completion", "model", "byot"] }
thiserror = "1"
anyhow = "1"
# 编辑器图标提取(image 负责缩放与 PNG 编码;pelite/ico 解析 Windows exe 资源;
# plist/icns 解析 macOS .app 图标)——四个均为纯 Rust,放通用依赖以便跨平台编译与单测
image = { version = "0.25.10", default-features = false, features = ["png"] }
pelite = "0.10.0"
ico = "0.5.0"
icns = "0.4.0"
plist = "1.10.0"
# git 读操作(status/分支/log/diff 等)走 libgit2 避免子进程开销;
# 写操作与网络操作(fetch/pull/push/clone)仍走系统 git CLI。
# default-features = false:只读本地操作不需要 https/ssh,避免引入 OpenSSL/libssh2
git2 = { version = "0.20", default-features = false }
# 全文搜索(search_project_text)的单词边界与用户正则模式
globset = "0.4"
regex = "1"
# JDK 在线安装(install_jdk)解压发行包 zip;仅 deflate 即可覆盖 Adoptium/Zulu 的归档
zip = { version = "2", default-features = false, features = ["deflate"] }
# 提交内图片预览(git_commit_file_blob):git blob 内容 base64 编码后经 IPC 传前端拼 data: URL
base64 = "0.22"
# ACP(Agent Client Protocol)官方客户端:wiki agent 后端与本地 coding agent CLI 的 JSON-RPC over stdio 交互
# unstable_end_turn_token_usage:PromptResponse.usage(UNSTABLE,agent 未必上报)供用量统计
agent-client-protocol = { version = "2", features = ["unstable_end_turn_token_usage"] }
# ACP agent 未上报 usage 时,按发送的 prompt 与最终正文估算 token 数
tiktoken-rs = "0.12"
# agent 子进程 spawn(与 agent-client-protocol 内部实现同源;自带 unix 进程组/Windows 无窗口标志)
async-process = "2"
# stderr 尾部采集等 futures AsyncRead 用法
futures = "0.3"
# agent CLI 安装探测(Windows 正确处理 PATHEXT/.cmd)
which = "7"
similar = "2"
# MCP 对外服务：首版通过 stdio 提供代码提交与 Wiki 目录查询。
rmcp = { version = "3.1.4", features = ["server", "transport-io"] }
jsonschema = "0.52.0"

[dev-dependencies]
urlpattern = "0.3"
url = "2"
