[package]
name = "repomeow"
version = "0.1.10"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "repomeow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-store = "2"
tauri-plugin-http = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml_ng = "0.10"
ignore = "0.4"
# walk 缓存的失效监听:项目内 package.json / yaml 变更时即时让目录遍历缓存失效
notify = "8"
rusqlite = { version = "0.31", features = ["bundled"] }
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", features = ["json", "blocking"] }
thiserror = "1"
anyhow = "1"
# 编辑器图标提取(image 负责缩放与 PNG 编码;pelite/ico 解析 Windows exe 资源;
# plist/icns 解析 macOS .app 图标)——四个均为纯 Rust,放通用依赖以便跨平台编译与单测
image = { version = "0.25.10", default-features = false, features = ["png"] }
pelite = "0.10.0"
ico = "0.5.0"
icns = "0.4.0"
plist = "1.10.0"
# git 读操作(status/分支/log/diff 等)走 libgit2 避免子进程开销;
# 写操作与网络操作(fetch/pull/push/clone)仍走系统 git CLI。
# default-features = false:只读本地操作不需要 https/ssh,避免引入 OpenSSL/libssh2
git2 = { version = "0.20", default-features = false }
# 全文搜索(search_project_text)的单词边界与用户正则模式
globset = "0.4"
regex = "1"

[dev-dependencies]
urlpattern = "0.3"
url = "2"
